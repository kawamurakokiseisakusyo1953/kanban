<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カメラ読取テスト v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#12151c; --card:#1c2230; --line:#2c3446; --txt:#e9edf5; --sub:#8b96a9;
    --accent:#4f9cf9; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  html,body { background:var(--bg); color:var(--txt); font-family:-apple-system,"Noto Sans JP",sans-serif; }
  body { padding:10px; padding-bottom:40px; }
  h1 { font-size:19px; font-weight:800; margin-bottom:4px; }
  .muted { color:var(--sub); font-size:12px; }
  #dbg { font-size:11px; color:var(--sub); margin-bottom:6px; word-break:break-all; }

  .camwrap { position:relative; width:100%; aspect-ratio:1/1; background:#000; border-radius:14px; overflow:hidden; margin-bottom:10px; }
  #v { width:100%; height:100%; object-fit:cover; display:block; }
  .flash { position:absolute; inset:0; background:var(--ok); opacity:0; transition:opacity .08s; pointer-events:none;
           display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:900; color:#06301f; }
  .flash.bad { background:var(--bad); color:#3a0d0d; }

  .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  button {
    background:var(--card); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:12px 14px; font-size:15px; font-weight:700; cursor:pointer; flex:1; min-width:110px;
  }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ghost { background:transparent; }
  button:active { opacity:.7; }
  button[disabled] { opacity:.4; }

  .big { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:8px; }
  .big .n { font-size:64px; font-weight:900; line-height:1; }
  .big .l { font-size:13px; color:var(--sub); margin-top:4px; }

  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat .v { font-size:26px; font-weight:800; }
  .stat .k { font-size:11px; color:var(--sub); margin-top:2px; }

  .last { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; font-size:13px; word-break:break-all; }
  .last b { font-size:20px; }

  .toggles { display:flex; gap:14px; margin-bottom:8px; font-size:13px; color:var(--sub); flex-wrap:wrap; }
  .toggles label { display:flex; align-items:center; gap:6px; }
  .toggles input { width:20px; height:20px; accent-color:var(--accent); }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--sub); font-size:12px; }
  td.num { text-align:right; font-weight:800; font-size:18px; }

  #err { color:var(--bad); font-size:13px; margin-bottom:8px; white-space:pre-wrap; }
</style>
</head>
<body>
  <h1>カメラ読取テスト v2 <span class="muted" id="mode">—</span></h1>
  <div id="dbg">—</div>
  <div id="err"></div>

  <div class="camwrap">
    <video id="v" playsinline autoplay muted></video>
    <div class="flash" id="flash"></div>
  </div>

  <div class="row">
    <button class="primary" id="startBtn" onclick="start()">▶ カメラ開始</button>
    <button class="ghost" id="torchBtn" onclick="toggleTorch()" disabled>🔦 ライト</button>
  </div>
  <div class="row">
    <button class="ghost" onclick="resetAll()">↺ リセット</button>
    <button class="ghost" id="pauseBtn" onclick="togglePause()" disabled>⏸ 一時停止</button>
    <button class="ghost" id="decBtn" onclick="toggleDecoder()">デコーダ: jsQR</button>
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="speedMode"> 速度テストモード（連射OK）</label>
    <label><input type="checkbox" id="beepOn" checked> 音</label>
    <label><input type="checkbox" id="vibOn" checked> バイブ</label>
  </div>

  <div class="big">
    <div id="arm" style="font-size:15px;font-weight:800;margin-bottom:6px;color:var(--ok);">● かざしてOK</div>
    <div class="n" id="total">0</div>
    <div class="l">読取カウント（有効QR）</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="v" id="decLast">— ms</div><div class="k">前回デコード時間</div></div>
    <div class="stat"><div class="v" id="decAvg">— ms</div><div class="k">平均デコード（直近30回）</div></div>
    <div class="stat"><div class="v" id="gapLast">— ms</div><div class="k">前回読取からの間隔</div></div>
    <div class="stat"><div class="v" id="fps">— /s</div><div class="k">判定回数（スキャンFPS）</div></div>
  </div>

  <div class="last" id="last">まだ読み取っていません</div>

  <div class="stats">
    <div class="stat"><div class="v" id="invalid">0</div><div class="k">対象外QR</div></div>
    <div class="stat"><div class="v" id="decMinMax">— / —</div><div class="k">デコード最小 / 最大 ms</div></div>
  </div>

  <table>
    <thead><tr><th>品番</th><th style="text-align:right">箱数</th></tr></thead>
    <tbody id="tally"></tbody>
  </table>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const QR_MIN = 63, QR_MAX = 350;
const FLOOR_MS = 350;             // 受け付け間隔の下限（チラつき対策）
const CLEAR_FRAMES = 3;           // 「何も映ってない」がこの回数続いたら再武装
const LOOP_MIN_MS = 90;           // デコード間隔の下限（詰まり防止）

let stream=null, track=null, video=document.getElementById('v');
let canvas=document.createElement('canvas'), cctx=canvas.getContext('2d', { willReadFrequently:true });
let running=false, paused=false, torchOn=false;

let decoderPref='jsqr';           // 'jsqr' | 'native'
let nativeDetector=null, nativeAvailable=false;

let total=0, invalidCount=0;
let lastAcceptTs=0, prevReadTs=0, lastLoopTs=0;
let armed=true, acceptedRaw='', emptyStreak=0;
let decHist=[], decMin=1e9, decMax=0;
let attempts=0, attemptWinStart=0;
let dbgFrame='—', dbgLastLen='—', dbgErr='—';
const tally = {};

const $ = id => document.getElementById(id);
function showErr(m){ $('err').textContent = m || ''; }

function renderDbg(){
  const using = (decoderPref==='native' && nativeAvailable) ? 'BarcodeDetector' : 'jsQR';
  $('dbg').textContent = '実デコーダ ' + using + ' / フレーム ' + dbgFrame
    + ' / 最終QR長 ' + dbgLastLen + ' / エラー ' + dbgErr;
}
function updateModeLabel(){
  const using = (decoderPref==='native' && nativeAvailable) ? 'BarcodeDetector' : 'jsQR';
  $('mode').textContent = '[' + using + ']';
  $('decBtn').textContent = 'デコーダ: ' + (decoderPref==='native'
      ? ('ネイティブ' + (nativeAvailable ? '' : '(無効→jsQR)'))
      : 'jsQR');
  renderDbg();
}
function toggleDecoder(){
  decoderPref = (decoderPref==='jsqr') ? 'native' : 'jsqr';
  updateModeLabel();
}

async function start(){
  showErr('');
  $('startBtn').disabled = true;

  // 音の許可（このクリックのタイミングで resume）
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
  } catch(e){}

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } },
      audio: false
    });
  } catch(e){
    showErr('カメラ起動失敗: ' + e.name + ' / ' + e.message);
    $('startBtn').disabled = false;
    return;
  }
  video.srcObject = stream;
  await video.play();
  track = stream.getVideoTracks()[0];

  try { await track.applyConstraints({ advanced:[{ focusMode:'continuous' }] }); } catch(e){}

  let caps = {};
  try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch(e){}
  $('torchBtn').disabled = !caps.torch;
  if (!caps.torch) $('torchBtn').textContent = '🔦 ライト（非対応）';

  // ネイティブの有無だけ調べる（使うかはトグル次第）
  nativeDetector = null; nativeAvailable = false;
  if ('BarcodeDetector' in window) {
    try {
      const f = await BarcodeDetector.getSupportedFormats();
      if (f.includes('qr_code')) { nativeDetector = new BarcodeDetector({ formats:['qr_code'] }); nativeAvailable = true; }
    } catch(e){}
  }
  updateModeLabel();

  running = true; paused = false;
  $('pauseBtn').disabled = false;
  attemptWinStart = performance.now();
  schedule();
}

// 画面タップでピント合わせ（対応端末のみ・ベストエフォート）
video.addEventListener('click', async () => {
  if (!track) return;
  try {
    await track.applyConstraints({ advanced:[{ focusMode:'single-shot' }] });
    setTimeout(() => { track.applyConstraints({ advanced:[{ focusMode:'continuous' }] }).catch(()=>{}); }, 1500);
  } catch(e){}
});

function schedule(){
  if (!running) return;
  if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) video.requestVideoFrameCallback(() => loop());
  else setTimeout(loop, LOOP_MIN_MS);
}

async function loop(){
  if (!running) return;
  if (paused) { schedule(); return; }

  const now = performance.now();
  if (now - lastLoopTs < LOOP_MIN_MS) { schedule(); return; }
  lastLoopTs = now;

  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) { schedule(); return; }
  dbgFrame = vw + 'x' + vh;

  // ★ 生産記録アプリと同じ：カメラ画像を丸ごとデコード（切り出しなし）
  if (canvas.width !== vw) { canvas.width = vw; canvas.height = vh; }
  cctx.drawImage(video, 0, 0, vw, vh);

  const useNative = (decoderPref==='native' && nativeAvailable && nativeDetector);
  const t0 = performance.now();
  let raw = null;
  try {
    if (useNative) {
      const codes = await nativeDetector.detect(canvas);
      if (codes && codes.length) raw = codes[0].rawValue;
      dbgErr = '—';
    } else if (typeof jsQR === 'function') {
      const img = cctx.getImageData(0, 0, vw, vh);
      const code = jsQR(img.data, vw, vh, { inversionAttempts: 'dontInvert' });
      if (code && code.data) raw = code.data;
      dbgErr = '—';
    } else {
      dbgErr = 'jsQR未ロード（ネット確認）';
    }
  } catch(e){
    dbgErr = (e.name || '') + ' ' + (e.message || '');
  }
  const dt = performance.now() - t0;

  countAttempt();
  if (raw != null) {
    dbgLastLen = raw.length;
    emptyStreak = 0;
    onDecode(raw, dt);
  } else {
    emptyStreak++;
    if (!armed && emptyStreak >= CLEAR_FRAMES) { armed = true; updateArmUI(); }
  }
  renderDbg();
  schedule();
}

function updateArmUI(){
  const el = $('arm');
  if ($('speedMode').checked) { el.textContent = '● 速度テスト（連射）'; el.style.color = 'var(--warn)'; return; }
  if (armed) { el.textContent = '● かざしてOK'; el.style.color = 'var(--ok)'; }
  else       { el.textContent = '● 読取済み — 一度離してください'; el.style.color = 'var(--sub)'; }
}

function countAttempt(){
  attempts++;
  const now = performance.now();
  if (now - attemptWinStart >= 1000) {
    $('fps').textContent = Math.round(attempts * 1000 / (now - attemptWinStart)) + ' /s';
    attempts = 0; attemptWinStart = now;
  }
}

function onDecode(raw, dt){
  decHist.push(dt); if (decHist.length > 30) decHist.shift();
  decMin = Math.min(decMin, dt); decMax = Math.max(decMax, dt);
  $('decLast').textContent = Math.round(dt) + ' ms';
  $('decAvg').textContent = Math.round(decHist.reduce((a,b)=>a+b,0) / decHist.length) + ' ms';
  $('decMinMax').textContent = Math.round(decMin) + ' / ' + Math.round(decMax);

  const now = performance.now();
  if (now - lastAcceptTs < FLOOR_MS) return;

  const speed = $('speedMode').checked;
  if (!speed) {
    // ゲート：武装解除中は、別のQRが来たときだけ再武装して受け付ける
    if (!armed) {
      if (raw !== acceptedRaw) { armed = true; }
      else { return; }
    }
  }

  const valid = raw.length >= QR_MIN && raw.length <= QR_MAX
             && raw.startsWith('20110607') && raw.includes('000.0');

  lastAcceptTs = now;

  if (!valid){
    invalidCount++;
    $('invalid').textContent = invalidCount;
    flash(true, '?');
    $('last').innerHTML = '<span style="color:var(--bad)">対象外QR</span>　長さ ' + raw.length
      + '<br><span class="muted">' + escapeHtml(raw.slice(0, 90)) + (raw.length>90?'…':'') + '</span>';
    if (!speed) { armed = false; acceptedRaw = raw; updateArmUI(); }
    return;
  }

  const gap = prevReadTs ? Math.round(now - prevReadTs) : 0;
  prevReadTs = now;
  $('gapLast').textContent = gap ? (gap + ' ms') : '—';

  const hinban = raw.substring(38, 63).trim();
  tally[hinban] = (tally[hinban] || 0) + 1;
  total++;
  $('total').textContent = total;

  if ($('beepOn').checked) beep();
  if ($('vibOn').checked && navigator.vibrate) navigator.vibrate(55);
  flash(false, 'OK');

  if (!speed) { armed = false; acceptedRaw = raw; updateArmUI(); }

  $('last').innerHTML = '品番 <b>' + escapeHtml(hinban || '(空)') + '</b>'
    + '　<span class="muted">デコード ' + Math.round(dt) + 'ms / 間隔 ' + (gap?gap+'ms':'—') + '</span>';
  renderTally();
}

function renderTally(){
  $('tally').innerHTML = Object.keys(tally).sort().map(h =>
    '<tr><td>' + escapeHtml(h) + '</td><td class="num">' + tally[h] + '</td></tr>').join('');
}

function flash(bad, txt){
  const f = $('flash');
  f.classList.toggle('bad', !!bad);
  f.textContent = txt || '';
  f.style.opacity = '0.9';
  setTimeout(() => { f.style.opacity = '0'; }, 130);
}

let audioCtx = null;
function beep(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'square'; o.frequency.value = 1250;
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    o.start(); o.stop(audioCtx.currentTime + 0.12);
  } catch(e){}
}

async function toggleTorch(){
  if (!track) return;
  torchOn = !torchOn;
  try {
    await track.applyConstraints({ advanced:[{ torch: torchOn }] });
    $('torchBtn').textContent = torchOn ? '🔦 ライト ON' : '🔦 ライト';
  } catch(e){
    torchOn = !torchOn;
    showErr('ライト切替失敗: ' + e.message);
  }
}

function togglePause(){
  paused = !paused;
  $('pauseBtn').textContent = paused ? '▶ 再開' : '⏸ 一時停止';
}

function resetAll(){
  total = 0; invalidCount = 0; decHist = []; decMin = 1e9; decMax = 0;
  prevReadTs = 0; lastAcceptTs = 0;
  armed = true; acceptedRaw = ''; emptyStreak = 0; updateArmUI();
  for (const k in tally) delete tally[k];
  $('total').textContent = '0';
  $('invalid').textContent = '0';
  $('decLast').textContent = '— ms';
  $('decAvg').textContent = '— ms';
  $('gapLast').textContent = '— ms';
  $('decMinMax').textContent = '— / —';
  $('last').textContent = 'まだ読み取っていません';
  $('tally').innerHTML = '';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('speedMode').addEventListener('change', () => { armed = true; emptyStreak = 0; updateArmUI(); });
updateModeLabel();
updateArmUI();
</script>
</body>
</html>
