<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f6fa">
<title>受入QRスキャン</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f4f6fa; --card:#ffffff; --line:#dbe2ea; --txt:#1a2233; --sub:#66707e;
    --accent:#2563eb; --ok:#16a34a; --warn:#b45309; --bad:#dc2626;
  }
  html { overscroll-behavior: none; overscroll-behavior-y: none; }
  html,body { background:var(--bg); color:var(--txt); font-family:-apple-system,"Noto Sans JP",sans-serif; }
  body { padding:10px 10px 40px; overscroll-behavior: none; overscroll-behavior-y: none; overflow-x: hidden; touch-action: pan-y; }
  h1 { font-size:19px; font-weight:800; margin-bottom:8px; }
  .sub { color:var(--sub); font-size:12px; }
  .screen { display:none; }
  .screen.on { display:block; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:10px; }
  label.fld { display:block; font-size:13px; color:var(--sub); margin:10px 0 6px; }
  select, input[type=password], input[type=text], input[type=number] {
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:13px 14px; font-size:17px; font-weight:700; outline:none;
  }
  select:focus, input:focus { border-color:var(--accent); }

  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button {
    background:var(--card); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:13px 14px; font-size:15px; font-weight:700; cursor:pointer; flex:1; min-width:100px;
  }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.ghost { background:transparent; }
  button:active { opacity:.7; }
  button[disabled] { opacity:.4; }
  .full { width:100%; flex:none; margin-top:8px; }

  .camwrap { position:relative; width:100%; aspect-ratio:1/1; background:#000; border-radius:14px; overflow:hidden; margin-bottom:8px; }
  #v { width:100%; height:100%; object-fit:cover; display:block; }
  .flash { position:absolute; inset:0; opacity:0; transition:opacity .08s; pointer-events:none;
           display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:900; }
  .flash.ok { background:var(--ok); color:#fff; }
  .flash.bad { background:var(--bad); color:#fff; }

  .resultbox { font-size:16px; font-weight:800; padding:12px 14px; border-radius:12px; margin-bottom:8px; text-align:center; line-height:1.4; }
  .resultbox.idle { background:var(--card); border:1px solid var(--line); color:var(--sub); }
  .resultbox.ok   { background:rgba(22,163,74,.10); border:1px solid var(--ok); color:var(--ok); }
  .resultbox.bad  { background:rgba(220,38,38,.10); border:1px solid var(--bad); color:var(--bad); }

  .hd { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; }
  .badge { background:var(--line); border-radius:20px; padding:5px 12px; font-weight:700; white-space:nowrap; }
  .badge.warn { background:rgba(180,83,9,.12); color:var(--warn); border:1px solid var(--warn); }
  .badge.off  { background:rgba(220,38,38,.12); color:var(--bad); border:1px solid var(--bad); }
  .badge.tap  { cursor:pointer; border:1px solid var(--accent); }
  .badge.tap:active { opacity:.7; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--sub); font-size:12px; }
  td.num { text-align:right; font-weight:800; }
  tr.bad td { color:var(--bad); }
  .taprow { cursor:pointer; }
  .taprow:active { background:rgba(0,0,0,.04); }
  .miniinput { display:inline-block; min-width:40px; padding:6px 8px; font-size:14px; font-weight:800; text-align:center;
               border:2px solid var(--line); border-radius:8px; cursor:pointer; }
  .miniinput:active { background:rgba(0,0,0,.05); }
  .miniinput.empty { color:var(--sub); font-weight:400; }

  /* 確認画面：品番1件＝1行のコンパクト表（100品番でも見渡せるように）。数量は太字で強調。
     6列（品番/箱数/端数/破壊/数量/×）を画面幅に収める＝横スクロール不要にするため、
     min-widthは指定せず、余白・文字サイズを詰めて table-layout:fixed で列幅を固定する。 */
  .rev-wrap { overflow-x:auto; }
  .rev-table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
  .rev-table col.c-hinban { width:32%; }
  .rev-table col.c-num    { width:14%; }
  .rev-table col.c-suryou { width:18%; }
  .rev-table col.c-del    { width:8%; }
  .rev-table th { text-align:right; color:var(--sub); font-size:10px; padding:5px 2px; border-bottom:1px solid var(--line); }
  .rev-table th:first-child, .rev-table td:first-child { text-align:left; }
  .rev-table td { padding:7px 2px; border-bottom:1px solid var(--line); text-align:right; vertical-align:middle; overflow:hidden; }
  .rev-table td:first-child { font-weight:700; word-break:break-all; }
  .rev-table td.suryou { font-weight:900; color:var(--ok); font-size:14px; }
  .miniinput.rev-num { min-width:0; width:100%; padding:5px 2px; font-size:13px; }
  .rev-del { display:inline-block; width:22px; height:22px; line-height:20px; text-align:center;
             border:1px solid var(--bad); color:var(--bad); border-radius:50%; cursor:pointer; font-weight:800; font-size:13px; }
  .rev-del:active { background:var(--bad); color:#fff; }

  .nyuka-display {
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg); border:2px solid var(--accent); border-radius:10px;
    padding:13px 14px; cursor:pointer; min-height:52px;
  }
  .nyuka-display:active { background:rgba(37,99,235,.08); }
  .nyuka-val { font-size:22px; font-weight:800; color:var(--txt); }
  .nyuka-val.empty { color:var(--sub); font-weight:400; font-size:16px; }
  .nyuka-icon { font-size:16px; color:var(--accent); opacity:.7; }

  .numpad { margin-top:10px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .numpad-keys { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .numpad-key {
    padding:18px 6px; font-size:24px; font-weight:800; border:none; border-radius:10px;
    background:var(--card); color:var(--txt); cursor:pointer; flex:none;
  }
  .numpad-key:active { background:var(--accent); color:#fff; }
  .numpad-key-wide { grid-column:span 2; }
  .numpad-key-del { background:rgba(220,38,38,.12); color:var(--bad); }
  .numpad-key-del:active { background:var(--bad); color:#fff; }
  .numpad-confirm {
    width:100%; padding:15px; font-size:17px; font-weight:800; background:var(--ok);
    color:#fff; border:none; border-radius:10px; cursor:pointer;
  }
  .numpad-confirm:active { opacity:.8; }

  .toggles { display:flex; gap:14px; margin:8px 0; font-size:13px; color:var(--sub); flex-wrap:wrap; }
  .toggles label { display:flex; align-items:center; gap:6px; }
  .toggles input { width:20px; height:20px; accent-color:var(--accent); }

  .hist-row { padding:13px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .hist-row:last-child { border-bottom:none; }
  .hist-row:active { background:rgba(0,0,0,.04); }
  .hist-row-main { font-size:15px; font-weight:800; }
  .hist-row-sub { font-size:12px; color:var(--sub); margin-top:2px; }

  .datelist { max-height:46vh; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .dateitem { padding:15px 14px; border-bottom:1px solid var(--line); font-size:17px; font-weight:700; cursor:pointer; }
  .dateitem:last-child { border-bottom:none; }
  .dateitem.sel { background:var(--accent); color:#fff; }

  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:50; }
  .sheet.on { display:flex; }
  .sheet .box { background:var(--card); border-radius:18px 18px 0 0; padding:18px; width:100%; }
  .sheet h3 { font-size:16px; margin-bottom:10px; }

  #err { color:var(--bad); font-size:13px; margin:6px 0; white-space:pre-wrap; }
  #dbg { font-size:11px; color:var(--sub); margin-bottom:6px; word-break:break-all; }
  .note { font-size:12px; color:var(--sub); margin-top:6px; }
  .resume { background:rgba(180,83,9,.08); border:1px solid var(--warn); color:var(--warn);
            border-radius:12px; padding:12px; margin-bottom:10px; font-size:14px; font-weight:700; }

  #verFixed { position:fixed; bottom:4px; right:8px; font-size:10px; color:var(--sub); opacity:.55; z-index:9999; pointer-events:none; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:300; display:none; align-items:center; justify-content:center; padding:22px; }
  .modal-overlay.on { display:flex; }
  .modal-box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 20px; width:100%; max-width:340px; }
  .modal-msg { font-size:15px; font-weight:700; line-height:1.7; white-space:pre-wrap; margin-bottom:18px; text-align:center; }
  .modal-btns { display:flex; gap:10px; }
  .modal-btns button { flex:1; }
</style>
</head>
<body>
<div id="verFixed">—</div>

<!-- ========== ログイン ========== -->
<div class="screen on" id="s-login">
  <h1>受入QRスキャン <span style="font-size:11px;color:var(--sub);font-weight:400;" id="verTag">—</span></h1>
  <div class="sub" id="netInfo">—</div>
  <div id="resumeBox" class="resume" style="display:none;"></div>
  <div class="card">
    <label class="fld">メーカー</label>
    <select id="loginMaker"></select>
    <label class="fld">パスワード</label>
    <input type="password" id="loginPw" autocomplete="current-password">
    <button class="primary full" id="loginBtn" onclick="doLogin()">ログイン</button>
    <div id="loginLoading" style="display:none;text-align:center;padding:10px 0 0;">
      <span class="sub">🔄 認証・マスタ読み込み中…しばらくお待ちください</span>
    </div>
    <div class="note">初回のみネット接続が必要です。以降はオフラインで読取できます。</div>
  </div>
  <div id="err"></div>
</div>

<!-- ========== 納入日 ========== -->
<div class="screen" id="s-date">
  <h1>納入日を選択</h1>
  <div class="sub" id="dateMakerInfo">—</div>
  <div id="datePendingBanner" class="resume" style="display:none;"></div>
  <div class="card">
    <div style="font-size:13px;color:var(--sub);margin-bottom:8px;">デフォルト（メーカー設定）が選択済みです。変更する場合は下から選択。</div>
    <div class="datelist" id="dateList"></div>
    <button class="primary full" onclick="startScanning()">この日で読取開始</button>
    <button class="ghost full" onclick="logout()">ログアウト</button>
  </div>
</div>

<!-- ========== スキャン ========== -->
<div class="screen" id="s-scan">
  <div class="hd">
    <span class="badge tap" id="scMaker" onclick="confirmSwitchMaker()">—</span>
    <span class="badge tap" id="scDate" onclick="backToDate()">—</span>
    <span class="badge" id="scNet">—</span>
  </div>
  <div id="dbg">—</div>

  <div class="camwrap">
    <video id="v" playsinline autoplay muted></video>
    <div class="flash" id="flash"></div>
  </div>

  <div class="resultbox idle" id="resultBox">📷 かざしてください</div>
  <div id="totalCount" style="font-size:13px;color:var(--sub);margin:4px 0;">読取 0枚</div>

  <div class="row">
    <button id="btnExtra" onclick="openExtra()" disabled>端数・破壊</button>
    <button class="ghost" id="btnUndo" onclick="undoLast()" disabled>↩ 直前取消</button>
  </div>
  <div class="row">
    <button class="ghost" id="btnTorch" onclick="toggleTorch()" disabled>🔦 ライト</button>
    <button class="ghost" id="btnPause" onclick="togglePause()">⏸ 一時停止</button>
    <button class="ghost" onclick="openHistory()">📋 履歴</button>
  </div>
  <button class="ok full" onclick="goReview()">読取おわり・確認へ</button>

  <div class="toggles">
    <label><input type="checkbox" id="bypass"> マスタ照合OFF（緊急時）</label>
    <label><input type="checkbox" id="beepOn" checked> 音</label>
    <label><input type="checkbox" id="vibOn" checked> バイブ</label>
  </div>

  <div class="card" style="padding:10px;">
    <div style="font-size:12px;color:var(--sub);margin-bottom:4px;">品番別（タップで端数/破壊入力）</div>
    <table><tbody id="tally"></tbody></table>
    <div id="rejBox" class="note" style="color:var(--bad);"></div>
  </div>
  <button class="ghost full" onclick="backToDate()">← 納入日にもどる</button>
</div>

<!-- ========== 読取履歴 ========== -->
<div class="screen" id="s-history">
  <h1>読取履歴</h1>
  <div class="sub" id="histInfo">—</div>
  <div class="card" id="histList"></div>
  <button class="ghost full" id="histBackBtn" onclick="closeHistory()">← もどる</button>
</div>

<!-- ========== 確認 ========== -->
<div class="screen" id="s-review">
  <h1>確認</h1>
  <div class="sub" id="revInfo">—</div>
  <div class="rev-wrap">
    <table class="rev-table">
      <colgroup>
        <col class="c-hinban"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-suryou"><col class="c-del">
      </colgroup>
      <thead><tr><th>品番</th><th>箱数</th><th>端数</th><th>破壊</th><th>数量</th><th></th></tr></thead>
      <tbody id="revBody"></tbody>
    </table>
  </div>
  <div class="note" style="margin-bottom:10px;">端数・破壊はタップで入力。「数量」＝ 箱数×収容数＋端数（収容数はQRから自動取得・要確認）。</div>
  <button class="ok full" id="sendBtn" onclick="doSend()">送信（ネット必要）</button>
  <button class="ghost full" onclick="updateScanHeader(); show('s-scan'); resumeCamera();">← 読取にもどる</button>
  <div id="err2" style="color:var(--bad);font-size:13px;margin-top:6px;white-space:pre-wrap;"></div>
</div>

<!-- ========== 完了 ========== -->
<div class="screen" id="s-done">
  <h1 id="doneTitle">送信完了</h1>
  <div class="card">
    <div id="doneBody" style="font-size:15px;line-height:1.7;"></div>
    <button class="primary full" onclick="continueScan()">続けて読取</button>
    <button class="ghost full" onclick="logout()">ログアウト</button>
  </div>
</div>

<!-- ========== 端数/破壊 パネル ========== -->
<div class="sheet" id="extraSheet">
  <div class="box">
    <h3 id="extraTitle">端数・破壊</h3>
    <label class="fld">対象品番</label>
    <select id="extraHinban"></select>
    <label class="fld">端数（最後の半端箱の入数。無ければ空）</label>
    <div class="nyuka-display" onclick="openExtraNumpad('hasuu')">
      <span id="extraHasuuDisp" class="nyuka-val empty">—</span><span class="nyuka-icon">⌨</span>
    </div>
    <input type="hidden" id="extraHasuu">
    <label class="fld">破壊数（無ければ空 or 0）</label>
    <div class="nyuka-display" onclick="openExtraNumpad('hakai')">
      <span id="extraHakaiDisp" class="nyuka-val empty">—</span><span class="nyuka-icon">⌨</span>
    </div>
    <input type="hidden" id="extraHakai">
    <div class="row" style="margin-top:12px;">
      <button class="ghost" onclick="clearExtra()">クリア</button>
      <button class="primary" onclick="saveExtra()">保存</button>
    </div>
    <button class="ghost full" onclick="closeExtra()">閉じる</button>
  </div>
</div>

<!-- ========== 数値入力テンキー（端数・破壊 共通、生産記録アプリと同じ方式） ========== -->
<div class="sheet" id="numpadSheet">
  <div class="box">
    <h3 id="numpadTitle">入力</h3>
    <div class="nyuka-display" style="pointer-events:none; margin-bottom:10px;">
      <span id="numpadDisp" class="nyuka-val empty">—</span>
    </div>
    <div class="numpad">
      <div class="numpad-keys">
        <button type="button" class="numpad-key" onclick="numpadPress('7')">7</button>
        <button type="button" class="numpad-key" onclick="numpadPress('8')">8</button>
        <button type="button" class="numpad-key" onclick="numpadPress('9')">9</button>
        <button type="button" class="numpad-key" onclick="numpadPress('4')">4</button>
        <button type="button" class="numpad-key" onclick="numpadPress('5')">5</button>
        <button type="button" class="numpad-key" onclick="numpadPress('6')">6</button>
        <button type="button" class="numpad-key" onclick="numpadPress('1')">1</button>
        <button type="button" class="numpad-key" onclick="numpadPress('2')">2</button>
        <button type="button" class="numpad-key" onclick="numpadPress('3')">3</button>
        <button type="button" class="numpad-key numpad-key-wide" onclick="numpadPress('0')">0</button>
        <button type="button" class="numpad-key numpad-key-del" onclick="numpadPress('del')">⌫</button>
      </div>
      <button type="button" class="numpad-confirm" onclick="numpadConfirm()">✔ 確定</button>
    </div>
    <button class="ghost full" onclick="numpadCancel()">キャンセル</button>
  </div>
</div>

<!-- ========== 確認/通知ダイアログ（ネイティブconfirm/alertは使わない＝「〜の内容」表示を出さないため） ========== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* ================= 設定 ================= */
const APP_VERSION = 'v1.21';   // 更新のたびにここを上げる（ログイン画面右上に表示。反映確認用）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzALEt3uPha_JbW7USYz8Q3TJnbg9gJauFe9yTEC3KqPrIqChkBLb-Tj0kt5WjqlMor/exec';

const MAKERS_FALLBACK = ['大澤熔接工業所','清国溶接','小山製作所','山田鉄工所','丸磯工業所','花木製作所','羽谷工業所','伊藤プレス','メタルクリーン','マルマツ','ウエルギコウ','松原工業所','安井鉄工所','真鍋工業','向井工作所','大動工業','アクトメタル','日本グラス','エバー','トライ','村田工業所','檜山技研工業所','加藤技研工業所','トヨアケメッキ','福洋精工'];

const QR_MIN = 63, QR_MAX = 350;
const FLOOR_MS = 350;
const CLEAR_FRAMES = 3;
const LOOP_MIN_MS = 90;
const AUTH_MAX_AGE_MS = 30 * 24 * 3600 * 1000;   // 記憶ログインの有効期間

const K_AUTH = 'rcv_auth', K_PENDING = 'rcv_pending', K_HIST = 'rcv_history', K_DEV = 'rcv_device';

/* ================= localStorage ================= */
function lget(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function lset(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function ldel(k){ try { localStorage.removeItem(k); } catch(e){} }

function deviceId(){
  let d = lget(K_DEV, null);
  if (!d){ d = Math.random().toString(36).slice(2,8); lset(K_DEV, d); }
  return d;
}

/* ================= 状態 ================= */
let auth = lget(K_AUTH, null);            // {maker,pw,offset,hinbanReady,hinban:[],torihiki:[],makers:[],ts}
let pending = lget(K_PENDING, null);      // {shukkaDate, scans:[{ts,qr,hinban}], extra:{hinban:{hasuu,hakai}}}
let hinbanSet = null, toriSet = null;
let qrSeen = new Set();                   // このpending内で既に受理した生QR（2度読み検知用）
let chosenDate = '';                      // yyyy/MM/dd
let scanSeq = 0;

function rebuildQrSeen(){
  qrSeen = new Set((pending && pending.scans ? pending.scans : []).map(s => s.qr));
}

/* ================= 画面遷移 ================= */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}

/* ================= ネット表示 ================= */
function netBadge(){
  const on = navigator.onLine;
  const t = on ? 'オンライン' : 'オフライン';
  const el = document.getElementById('netInfo'); if (el) el.textContent = '状態: ' + t;
  const b = document.getElementById('scNet');
  if (b){ b.textContent = t; b.className = 'badge' + (on ? '' : ' off'); }
}
window.addEventListener('online', netBadge);
window.addEventListener('offline', netBadge);

/* ================= 起動 ================= */
window.addEventListener('load', () => {
  document.getElementById('verTag').textContent = APP_VERSION;
  document.getElementById('verFixed').textContent = APP_VERSION;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  netBadge();

  // メーカー候補
  const sel = document.getElementById('loginMaker');
  const makers = (auth && auth.makers && auth.makers.length) ? auth.makers : MAKERS_FALLBACK;
  sel.innerHTML = '<option value="">選択してください</option>' + makers.map(m => '<option>'+esc(m)+'</option>').join('');

  pending = lget(K_PENDING, null);

  // ログイン済み（記憶が有効期限内）なら、ログイン画面を自動スキップして納入日画面へ。
  // 期限切れなら入力欄だけ埋めて、通常のログイン画面を出す（再認証を促す）。
  if (auth && (Date.now() - (auth.ts || 0)) < AUTH_MAX_AGE_MS){
    setAuthSets();
    enterDateScreen();
  } else {
    if (auth){
      sel.value = auth.maker || '';
      document.getElementById('loginPw').value = auth.pw || '';
    }
    renderResumeBoxOnLogin();
  }
});

// ログイン画面用：ログインしていない状態で未送信データが残っている場合の案内
function renderResumeBoxOnLogin(){
  const rb = document.getElementById('resumeBox');

    rb.style.display = 'block';

      + '<br>そのメーカーでログインしてから送信してください。'

function setAuthSets(){
  // hinbanReady が false（品番タブ未整備）なら hinbanSet は null にして照合スキップ。
  // auth.hinban は空配列 [] でも真値になるため、配列そのものでは判定しない。
  hinbanSet = (auth && auth.hinbanReady) ? new Set((auth.hinban || []).map(x=>String(x).trim())) : null;
  toriSet   = (auth && auth.torihiki && auth.torihiki.length) ? new Set(auth.torihiki.map(x=>String(x).trim())) : null;
}

function resumePending(){

function discardPending(){

/* ================= ログイン ================= */
function doLogin(){
  const maker = document.getElementById('loginMaker').value.trim();
  const pw = document.getElementById('loginPw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  if (!maker || !pw){ err.textContent = 'メーカーとパスワードを入力してください'; return; }

  const btn = document.getElementById('loginBtn');
  const loading = document.getElementById('loginLoading');
  btn.disabled = true; btn.textContent = 'ログイン中...';
  loading.style.display = 'block';

  function finishLoading(){ btn.disabled = false; btn.textContent = 'ログイン'; loading.style.display = 'none'; }

  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
                   body: JSON.stringify({ action:'login', maker: maker, pw: pw }) })
    .then(r => r.json()).then(res => {
    finishLoading();
    if (!res.ok){ err.textContent = res.message || 'ログイン失敗'; return; }
    auth = {
      maker: res.maker, pw: pw, offset: res.offset || 0,
      hinbanReady: !!res.hinbanReady, hinban: res.hinban || [], torihiki: res.torihiki || [],
      makers: res.makers || MAKERS_FALLBACK, ts: Date.now()
    };
    lset(K_AUTH, auth);
    setAuthSets();
    enterDateScreen();
  }).catch(e => {
    finishLoading();
    // オフライン：記憶ログインで通す
    if (auth && auth.maker === maker && auth.pw === pw && (Date.now() - (auth.ts||0)) < AUTH_MAX_AGE_MS){
      setAuthSets();
      enterDateScreen();
    } else {
      err.textContent = 'ネットに繋がりません。初回ログインはオンラインで行ってください。';
    }
  });
}

function logout(){
  stopCamera();
  ldel(K_AUTH);
  // pending は消さない（未送信が残っていれば次回復帰）
  auth = null;
  document.getElementById('loginPw').value = '';
  show('s-login');
  location.reload();
}
// スキャン画面のメーカーバッジから：ログイン画面に戻る（＝メーカー切替の入口）。読取中データは保持される。
function confirmSwitchMaker(){

}

/* ================= 納入日 ================= */
function addBusinessDays(base, n){
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  let added = 0;
  while (added < n){ d.setDate(d.getDate()+1); const w = d.getDay(); if (w !== 0 && w !== 6) added++; }
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate()+1); // n<=0で週末なら翌営業日へ
  return d;
}
function fmtDate(d){
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
function jpDate(d){
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return (d.getMonth()+1) + '/' + d.getDate() + '（' + w + '）';
}

// 納入日画面で「未送信データがある」ことを常に見えるようにする。
// 今ログイン中のメーカーのものなら確認・送信の導線、別メーカーのものなら混在しないよう警告する。
function renderPendingBanner(){
  const el = document.getElementById('datePendingBanner');
  if (!pending || !pending.scans || !pending.scans.length){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  if (pending.maker === auth.maker){
    el.innerHTML = '📦 未送信 ' + pending.scans.length + '枚（納入日 ' + esc(pending.shukkaDate) + '）があります。'
      + '<br><button class="primary full" onclick="continuePending()">続きを読み取る</button>'
      + '<button class="ghost full" onclick="resumePending()">確認・送信する</button>'
      + '<button class="ghost full" onclick="discardPending()">このデータを破棄する</button>';
  } else {
    el.innerHTML = '⚠️ 別メーカー「' + esc(pending.maker) + '」の未送信データ ' + pending.scans.length + '枚が残っています。'
      + '<br>送信するには一度「' + esc(pending.maker) + '」でログインし直してください。'
      + '<br><button class="ghost full" onclick="logout()">ログイン画面へ</button>'
      + '<button class="ghost full" onclick="discardPending()">このデータを破棄する</button>';
  }
}

function enterDateScreen(){
  document.getElementById('dateMakerInfo').textContent = auth.maker
    + '　品番マスタ: ' + (auth.hinbanReady ? (auth.hinban.length + '件') : '未整備（照合スキップ）');
  renderPendingBanner();
  const today = new Date();
  const def = addBusinessDays(today, auth.offset || 0);
  const defStr = fmtDate(def);
  chosenDate = defStr;

  // 今日＋以降の平日を並べる
  const list = document.getElementById('dateList');
  list.innerHTML = '';
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let cnt = 0;
  while (cnt < 25){
    const w = d.getDay();
    if (w !== 0 && w !== 6){
      const s = fmtDate(d);
      const div = document.createElement('div');
      div.className = 'dateitem' + (s === defStr ? ' sel' : '');
      div.textContent = jpDate(d) + (s === defStr ? '　← デフォルト' : '');
      div.dataset.d = s;
      div.onclick = function(){
        chosenDate = this.dataset.d;
        list.querySelectorAll('.dateitem').forEach(x => x.classList.remove('sel'));
        this.classList.add('sel');
      };
      list.appendChild(div);
      cnt++;
    }
    d.setDate(d.getDate()+1);
  }
  show('s-date');
}

/* ================= スキャン開始 ================= */
function startScanning(){
  if (!chosenDate){ showAlert('納入日を選択してください'); return; }
  const hasPending = pending && pending.scans && pending.scans.length;

  // 未送信データ（このアプリは同時に1件しか保持できない）が、
  // 別メーカー or 別納入日のものである間は、新しい読取を始めさせない（上書き・混在・誤送信防止）。
  // 送信または破棄するまでブロックする（納入日画面の案内から操作できる）。
  if (hasPending && pending.maker !== auth.maker){
    showAlert('別メーカー「' + pending.maker + '」の未送信データ（' + pending.shukkaDate + ' / ' + pending.scans.length + '枚）が残っています。\nそちらを送信するか破棄してから、読取を始めてください。\n（この画面上部の案内から操作できます）');
    return;
  }
  if (hasPending && pending.shukkaDate !== chosenDate){
    showAlert('納入日「' + pending.shukkaDate + '」の未送信データ（' + pending.scans.length + '枚）が残っています。\nそちらを送信するか破棄してから、別の納入日で読取を始めてください。\n（この画面上部の案内から操作できます）');
    return;
  }
  reallyStartScanning();
}
function reallyStartScanning(){
  if (!pending || pending.maker !== auth.maker || pending.shukkaDate !== chosenDate){
    pending = { maker: auth.maker, shukkaDate: chosenDate, scans: [], extra: {} };
    lset(K_PENDING, pending);
  }
  rebuildQrSeen();
  updateScanHeader();
  netBadge();
  renderTally();
  show('s-scan');
  startCamera();
}
// 上部バッジ（メーカー名／納入日）を、今のpending（無ければauth/chosenDate）に合わせて必ず更新する。
// s-scan画面を出す経路が複数あるため、経路によっては「—」のままになるのを防ぐため一元化。
function updateScanHeader(){
  const maker = (pending && pending.maker) || (auth && auth.maker) || '—';
  const date  = (pending && pending.shukkaDate) || chosenDate || '—';
  document.getElementById('scMaker').textContent = maker + ' ▾';
  document.getElementById('scDate').textContent = date + ' ▾';
}
function backToDate(){ stopCamera(); enterDateScreen(); }
function continueScan(){ ldel(K_PENDING); pending = null; enterDateScreen(); }
// 納入日画面のバナューから「続きを読み取る」：日付選択をやり直さず、そのままスキャン画面へ戻る。
// （アプリを落として再度開いた場合、既定の納入日候補リストは「今日以降」しか出ないため、
//   pending保存済みの納入日がリストに無いことがある＝その場合でもここなら確実に戻れる）
function continuePending(){
  if (!pending || !pending.scans || !pending.scans.length) return;
  chosenDate = pending.shukkaDate;
  reallyStartScanning();
}

/* ================= カメラ / デコード ================= */
let stream=null, track=null, video=document.getElementById('v');
let cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
let running=false, paused=false, torchOn=false;
let armed=true, emptyStreak=0, acceptedRaw='', lastAcceptTs=0, lastLoopTs=0;
let dbgFrame='—', dbgLast='—', dbgErr='—';

async function startCamera(){
  running=false; stopCamera();
  document.getElementById('err') && (document.getElementById('err').textContent='');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }, audio:false
    });
  } catch(e){
    showAlert('カメラ起動失敗: ' + e.name + ' / ' + e.message); return;
  }
  video.srcObject = stream; await video.play();
  track = stream.getVideoTracks()[0];
  try { await track.applyConstraints({ advanced:[{ focusMode:'continuous' }] }); } catch(e){}
  let caps={}; try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch(e){}
  document.getElementById('btnTorch').disabled = !caps.torch;

  armed=true; emptyStreak=0; acceptedRaw=''; paused=false;
  document.getElementById('btnPause').textContent = '⏸ 一時停止';
  running=true; lastLoopTs=0;
  try { if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); } catch(e){}
  showResult('idle', '📷 かざしてください');
  schedule();
}
function resumeCamera(){
  renderTally();               // 確認画面での削除・端数編集をスキャン画面のタリーに反映
  refreshResultForLastHinban(); // 上の結果表示（累積）も、編集後の最新値に更新
  if (stream && !running){ running=true; schedule(); } else if (!stream){ startCamera(); }
}
// スキャン画面の結果表示は「読み取った瞬間」の値のまま固定なので、
// 確認画面で端数・破壊を後から編集して戻ってきた時は、最後にスキャンした品番ぶんを再計算して出し直す。
let lastScannedHinban = null;
function refreshResultForLastHinban(){
  if (!lastScannedHinban || !pending || !pending.scans) return;
  const arr = pending.scans.filter(s => s.hinban === lastScannedHinban);
  if (!arr.length){ showResult('idle', '📷 かざしてください'); return; }
  const ex = pending.extra[lastScannedHinban] || {};
  const hasuuNow = ex.hasuu ? (parseInt(ex.hasuu, 10) || 0) : 0;
  const hakoNow = hasuuNow > 0 ? (arr.length - 1) : arr.length;
  const youbun = arr[0].youbun || 0;
  const suryouNow = hakoNow * youbun + hasuuNow;
  showResult('ok', '✅ 品番「' + esc(lastScannedHinban) + '」<br>この品番の累積 ' + arr.length + '枚（' + hakoNow + '箱 / ' + suryouNow + '個）<br><span class="sub">全体合計 ' + pending.scans.length + '枚</span>');
}
function stopCamera(){
  running=false;
  if (stream){ stream.getVideoTracks().forEach(t=>t.stop()); stream=null; track=null; }
}
video.addEventListener('click', async () => {
  if (!track) return;
  try { await track.applyConstraints({ advanced:[{ focusMode:'single-shot' }] });
    setTimeout(()=>{ track.applyConstraints({ advanced:[{ focusMode:'continuous' }] }).catch(()=>{}); }, 1400);
  } catch(e){}
});
function schedule(){
  if (!running) return;
  if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) video.requestVideoFrameCallback(loop);
  else setTimeout(loop, LOOP_MIN_MS);
}
async function loop(){
  if (!running) return;
  if (paused){ schedule(); return; }
  const now = performance.now();
  if (now - lastLoopTs < LOOP_MIN_MS){ schedule(); return; }
  lastLoopTs = now;
  const vw=video.videoWidth, vh=video.videoHeight;
  if (!vw || !vh){ schedule(); return; }
  dbgFrame = vw+'x'+vh;
  if (cv.width !== vw){ cv.width=vw; cv.height=vh; }
  cx.drawImage(video, 0, 0, vw, vh);

  let raw=null;
  try {
    if (typeof jsQR === 'function'){
      const img = cx.getImageData(0,0,vw,vh);
      const c = jsQR(img.data, vw, vh, { inversionAttempts:'dontInvert' });
      if (c && c.data) raw = c.data;
      dbgErr='—';
    } else dbgErr='jsQR未ロード';
  } catch(e){ dbgErr = (e.name||'')+' '+(e.message||''); }

  if (raw != null){ dbgLast = raw.length; emptyStreak = 0; onDecode(raw); }
  else {
    emptyStreak++;
    // 再武装は「次を受け付けられる」ようにするだけ。結果表示は次の読取（成功/失敗）まで保持する
    // （＝札を離した瞬間に「かざしてください」で上書きして消えるのを防ぐ）。
    if (!armed && emptyStreak >= CLEAR_FRAMES){ armed = true; }
  }

  document.getElementById('dbg').textContent = 'jsQR / ' + dbgFrame + ' / QR長 ' + dbgLast + ' / ' + dbgErr;
  schedule();
}
// カメラ直下の結果表示：かざす前後の状態ではなく「直前の読取が成功/失敗したか＋理由」を表示する。
// 次に空フレームが続いて再武装するまで、この表示は消えずに残る（スクロールしなくても理由が読める）。
function showResult(kind, msg){
  const el = document.getElementById('resultBox');
  el.className = 'resultbox ' + kind;
  el.innerHTML = msg;   // 呼び出し側で <br> による改行を使うため innerHTML（埋め込む値は esc() 済みのこと）
}

/* ================= 読取判定（フェーズ順に判定） ================= */
// ① QR形式チェック → ② 2度読み（このpending内でのQR内容重複）→ ③ 別メーカー（取引先コード）→ ④ 品番マスタ不一致
let rejCounts = { format:0, dup:0, tori:0, master:0 };
const REJ_LABEL = { format:'NG', dup:'重複', tori:'他社', master:'マスタ外' };

function onDecode(raw){
  const now = performance.now();
  if (now - lastAcceptTs < FLOOR_MS) return;
  if (!armed){
    if (raw !== acceptedRaw) armed = true;
    else return;
  }

  const bypass = document.getElementById('bypass').checked;
  lastAcceptTs = now;
  acceptedRaw = raw; armed = false;   // 表示はこの後の分岐で showResult() が確定させる

  // ①フォーマット
  const okFormat = raw.length >= QR_MIN && raw.length <= QR_MAX
                && raw.slice(0,8) === '20110607' && raw.indexOf('000.0') !== -1;
  if (!okFormat){
    rejCounts.format++;
    reject('format', '読取エラー：QRの形式が不正です。再スキャンしてください（長さ ' + raw.length + '）');
    return;
  }

  // ②2度読み（ローカルに保存済みの生QRと完全一致）
  if (qrSeen.has(raw)){
    rejCounts.dup++;
    reject('dup', '重複エラー：このかんばんは読み取り済みです。再スキャンしないでください');
    return;
  }

  const hinban = raw.substring(38, 63).trim();
  const tori   = raw.substring(20, 26).trim();  // 取引先コード：6文字幅（viewer_v5.py の TORIHIKISAKI_START/END = 20/26 と同じ）

  // ③別メーカー（取引先コード不一致）
  if (!bypass && toriSet && tori && !toriSet.has(tori)){
    rejCounts.tori++;
    reject('tori', '別メーカーの札です（取引先コード ' + tori + '）。再スキャンして下さい');
    return;
  }

  // ④品番マスタ不一致
  if (!bypass && hinbanSet && !hinbanSet.has(hinban)){
    rejCounts.master++;
    reject('master', '品番マスタ不一致：品番「' + (hinban || '(空)') + '」はマスタにありません。再スキャンして下さい');
    return;
  }

  // 受理
  // 収容数（1箱あたりの入数）：QRの86文字目から7桁（.aia解析より）。表示専用（送信データには含めない）
  const youbun = parseInt(raw.substring(85, 92).trim(), 10) || 0;
  const d = new Date();
  const ts = fmtDate(d) + ' ' + d.toTimeString().slice(0,8)
           + '.' + String(d.getMilliseconds()).padStart(3,'0')
           + '/' + deviceId() + '-' + (++scanSeq);
  pending.scans.push({ ts: ts, qr: raw, hinban: hinban, youbun: youbun });
  qrSeen.add(raw);
  lset(K_PENDING, pending);
  flash('ok', 'OK');

  // この品番の現時点の累積を表示（端数はまだ未確定なら0扱いの暫定値。端数・破壊を入れると反映される）
  lastScannedHinban = hinban;
  refreshResultForLastHinban();

  if (document.getElementById('beepOn').checked) beep(1250, .28);
  if (document.getElementById('vibOn').checked && navigator.vibrate) navigator.vibrate(350);
  renderTally();
}
function reject(kind, msg){
  flash('bad', REJ_LABEL[kind] || '×');
  showResult('bad', '❌ ' + esc(msg));
  if (document.getElementById('beepOn').checked) beep(320, .35);
  if (document.getElementById('vibOn').checked && navigator.vibrate) navigator.vibrate([220,120,220,120,220]);
  const box = document.getElementById('rejBox');
  box.textContent = '弾いた累計：重複 ' + rejCounts.dup + ' / マスタ外 ' + rejCounts.master + ' / 他社 ' + rejCounts.tori + ' / 形式 ' + rejCounts.format;
}

/* ================= 取消 ================= */
function undoLast(){
  if (!pending || !pending.scans.length) return;
  const last = pending.scans[pending.scans.length - 1];
  showConfirm('直前の読取を取り消します。\n品番: ' + last.hinban + '\nよろしいですか？', function(){
    pending.scans.pop();
    qrSeen.delete(last.qr);
    const stillHas = pending.scans.some(s => s.hinban === last.hinban);
    if (!stillHas) delete pending.extra[last.hinban];
    lset(K_PENDING, pending);
    renderTally();
    refreshResultForLastHinban();
  });
}
function updateUndoBtn(){
  const btn = document.getElementById('btnUndo');
  const has = !!(pending && pending.scans && pending.scans.length);
  btn.disabled = !has;
  document.getElementById('btnExtra').disabled = !has;
}

/* ================= タリー ================= */
function tallyMap(){
  const m = {};
  pending.scans.forEach(s => { m[s.hinban] = (m[s.hinban]||0) + 1; });
  return m;
}
function renderTally(){
  const m = tallyMap();
  const keys = Object.keys(m).sort();
  const tb = document.getElementById('tally');
  tb.innerHTML = keys.map(h => {
    const ex = pending.extra[h] || {};
    const tag = [];
    if (ex.hasuu) tag.push('端数' + ex.hasuu);
    if (ex.hakai) tag.push('破壊' + ex.hakai);
    return '<tr class="taprow" onclick="openExtra(\'' + esc(h).replace(/'/g,"\\'") + '\')">'
      + '<td>' + esc(h) + (tag.length ? ' <span style="color:var(--warn);font-size:12px;">'+tag.join(' ')+'</span>' : '') + '</td>'
      + '<td class="num">' + m[h] + '</td></tr>';
  }).join('');
  document.getElementById('totalCount').textContent = '読取 ' + (pending && pending.scans ? pending.scans.length : 0) + '枚';
  updateUndoBtn();
}

/* ================= 端数/破壊 ================= */
function openExtra(hinban){
  const m = tallyMap();
  const keys = Object.keys(m).sort();
  if (!keys.length){ return; }
  const sel = document.getElementById('extraHinban');
  sel.innerHTML = keys.map(k => '<option'+((hinban && k===hinban)?' selected':'')+'>'+esc(k)+'</option>').join('');
  if (!hinban){
    const last = pending.scans[pending.scans.length-1];
    if (last) sel.value = last.hinban;
  }
  loadExtraInputs();
  document.getElementById('extraSheet').classList.add('on');
}
function loadExtraInputs(){
  const h = document.getElementById('extraHinban').value;
  const ex = pending.extra[h] || {};
  document.getElementById('extraHasuu').value = (ex.hasuu != null ? ex.hasuu : '');
  document.getElementById('extraHakai').value = (ex.hakai != null ? ex.hakai : '');
  updateExtraDisplays();
}
document.getElementById('extraHinban').addEventListener('change', loadExtraInputs);
function updateExtraDisplays(){
  setNyukaDisp('extraHasuuDisp', document.getElementById('extraHasuu').value);
  setNyukaDisp('extraHakaiDisp', document.getElementById('extraHakai').value);
}
function setNyukaDisp(id, val){
  const el = document.getElementById(id);
  if (val === '' || val == null){ el.textContent = '—'; el.classList.add('empty'); }
  else { el.textContent = val; el.classList.remove('empty'); }
}
// 端数・破壊パネルの各欄をタップ → 共通テンキーを開く（生産記録アプリと同じ方式）
function openExtraNumpad(which){
  const inputId = which === 'hasuu' ? 'extraHasuu' : 'extraHakai';
  const label   = which === 'hasuu' ? '端数（半端箱の入数）' : '破壊数';
  const cur = document.getElementById(inputId).value;
  openNumpad(label, cur, function(v){
    document.getElementById(inputId).value = (v === '' ? '' : v);
    updateExtraDisplays();
  });
}
function saveExtra(){
  const h = document.getElementById('extraHinban').value;
  const hs = document.getElementById('extraHasuu').value;
  const hk = document.getElementById('extraHakai').value;
  const o = {};
  if (hs !== '') o.hasuu = String(parseInt(hs,10) || 0);
  if (hk !== '') o.hakai = String(parseInt(hk,10) || 0);
  if (Object.keys(o).length) pending.extra[h] = o; else delete pending.extra[h];
  lset(K_PENDING, pending);
  renderTally();
  if (h === lastScannedHinban) refreshResultForLastHinban();
  closeExtra();
}
function clearExtra(){
  const h = document.getElementById('extraHinban').value;
  const ex = pending.extra[h];
  if (!ex || (!ex.hasuu && !ex.hakai)) return;   // 何も入ってなければ確認不要
  showConfirm('品番「' + h + '」の端数・破壊の入力をクリアします。\nよろしいですか？', function () {
    delete pending.extra[h];
    lset(K_PENDING, pending);
    document.getElementById('extraHasuu').value = '';
    document.getElementById('extraHakai').value = '';
    updateExtraDisplays();
    renderTally();
    if (h === lastScannedHinban) refreshResultForLastHinban();
  });
}
function closeExtra(){ document.getElementById('extraSheet').classList.remove('on'); }

/* ================= 共通テンキー（端数/破壊 の数値入力。生産記録アプリと同じ方式） ================= */
let numpadBuf = '', numpadCallback = null;
function openNumpad(title, initial, cb){
  document.getElementById('numpadTitle').textContent = title;
  numpadBuf = (initial != null && initial !== '') ? String(initial) : '';
  numpadCallback = cb;
  renderNumpadDisp();
  document.getElementById('numpadSheet').classList.add('on');
}
function numpadPress(k){
  if (k === 'del') numpadBuf = numpadBuf.slice(0, -1);
  else numpadBuf = (numpadBuf === '0') ? k : numpadBuf + k;
  renderNumpadDisp();
}
function renderNumpadDisp(){ setNyukaDisp('numpadDisp', numpadBuf); }
function numpadConfirm(){
  document.getElementById('numpadSheet').classList.remove('on');
  const cb = numpadCallback; numpadCallback = null;
  if (cb) cb(numpadBuf === '' ? '' : parseInt(numpadBuf, 10));
}
function numpadCancel(){
  document.getElementById('numpadSheet').classList.remove('on');
  numpadCallback = null;
}

/* ================= 確認/通知ダイアログ（自前モーダル） =================
   window.confirm()/alert() は使わない。Android Chrome では
   「<サイト名> の内容」という見出しが必ず付いて出てしまうため。 */
function showModal(msg, buttons){
  document.getElementById('modalMsg').textContent = msg;
  const area = document.getElementById('modalBtns');
  area.innerHTML = '';
  buttons.forEach(function (b) {
    const el = document.createElement('button');
    el.className = b.cls || 'ghost';
    el.textContent = b.label;
    el.onclick = function () { closeModal(); if (b.action) b.action(); };
    area.appendChild(el);
  });
  document.getElementById('modalOverlay').classList.add('on');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('on'); }
function showAlert(msg, okCb){
  showModal(msg, [{ label:'OK', cls:'primary', action: okCb }]);
}
function showConfirm(msg, yesCb, noCb){
  showModal(msg, [
    { label:'キャンセル', cls:'ghost', action: noCb },
    { label:'OK', cls:'primary', action: yesCb }
  ]);
}

/* ================= 確認 ================= */
function goReview(){
  if (!pending.scans.length){ showAlert('まだ1枚も読み取っていません'); return; }
  running = false;   // カメラ止めずに一時停止（戻れる）
  renderReview();
  show('s-review');
}
// 品番別の集計行（品番・枚数・収容数・箱数・端数・破壊・数量）を1箇所にまとめる。確認画面・履歴保存の両方で使う。
// 数量 ＝ 箱数 × 収容数 ＋ 端数
function reviewItems(){
  const byH = {};
  pending.scans.forEach(s => { (byH[s.hinban] = byH[s.hinban] || []).push(s); });
  return Object.keys(byH).sort().map(function (h) {
    const arr = byH[h];
    const mai = arr.length;
    const ex = pending.extra[h] || {};
    const hasuuNum = ex.hasuu ? (parseInt(ex.hasuu, 10) || 0) : 0;
    const hako = hasuuNum > 0 ? (mai - 1) : mai;
    const youbun = arr[0].youbun || 0;   // 同じ品番なら全枚同じ値のはず
    const suryou = hako * youbun + hasuuNum;
    return { hinban: h, mai: mai, hako: hako, youbun: youbun, suryou: suryou, hasuu: ex.hasuu || '', hakai: ex.hakai || '' };
  });
}
// 品番ごとにカード表示（横スクロール不要）。端数・破壊はタップで共通テンキーを開く。
// data属性で受け渡すことで、品番に含まれる記号によるエスケープ絡みの事故を避ける。
function renderReview(){
  document.getElementById('revInfo').textContent = pending.maker + '　納入日 ' + pending.shukkaDate + '　合計 ' + pending.scans.length + '枚';
  const tb = document.getElementById('revBody');
  tb.innerHTML = reviewItems().map(function (it) {
    const h = it.hinban;
    const hAttr = esc(h);
    return '<tr>'
      + '<td>' + esc(h) + '</td>'
      + '<td>' + it.hako + '</td>'
      + '<td><span class="miniinput rev-num numtap' + (it.hasuu===''?' empty':'') + '" data-h="' + hAttr + '" data-key="hasuu">' + (it.hasuu!==''?it.hasuu:'—') + '</span></td>'
      + '<td><span class="miniinput rev-num numtap' + (it.hakai===''?' empty':'') + '" data-h="' + hAttr + '" data-key="hakai">' + (it.hakai!==''?it.hakai:'—') + '</span></td>'
      + '<td class="suryou">' + it.suryou + '</td>'
      + '<td><span class="rev-del" data-h="' + hAttr + '" title="この品番を削除">✕</span></td>'
      + '</tr>';
  }).join('');
  tb.querySelectorAll('.numtap').forEach(function (el) {
    el.addEventListener('click', function () {
      const h = el.dataset.h, key = el.dataset.key;
      const cur = (pending.extra[h] || {})[key] || '';
      openNumpad(key === 'hasuu' ? '端数（半端箱の入数）' : '破壊数', cur, function (v) {
        revEdit(h, key, v === '' ? '' : String(v));
      });
    });
  });
  tb.querySelectorAll('.rev-del').forEach(function (el) {
    el.addEventListener('click', function () { deleteHinbanFromReview(el.dataset.h); });
  });
}
// 確認画面から、1品番ぶん（そのスキャン全部）をまるごと削除する
function deleteHinbanFromReview(h){
  const cnt = pending.scans.filter(s => s.hinban === h).length;
  showConfirm('品番「' + h + '」を削除します（' + cnt + '枚ぶん）。\nよろしいですか？', function () {
    pending.scans.filter(s => s.hinban === h).forEach(s => qrSeen.delete(s.qr));
    pending.scans = pending.scans.filter(s => s.hinban !== h);
    delete pending.extra[h];
    lset(K_PENDING, pending);
    if (!pending.scans.length) {
      showAlert('全て削除しました。読取画面にもどります。', function () { updateScanHeader(); show('s-scan'); resumeCamera(); });
      return;
    }
    renderReview();
  });
}
function revEdit(h, key, val){
  val = String(val).trim();
  const o = pending.extra[h] || {};
  if (val === '') delete o[key]; else o[key] = String(parseInt(val,10) || 0);
  if (Object.keys(o).length) pending.extra[h] = o; else delete pending.extra[h];
  lset(K_PENDING, pending);
  renderReview();
}

/* ================= 送信 ================= */
function buildRows(){
  const byH = {};
  pending.scans.forEach(s => { (byH[s.hinban] = byH[s.hinban] || []).push(s); });
  const rows = [];
  Object.keys(byH).forEach(h => {
    const arr = byH[h];
    const ex = pending.extra[h] || {};
    arr.forEach((s, i) => {
      const isLast = (i === arr.length - 1);
      rows.push({
        ts: s.ts, qr: s.qr, hinban: h,
        hasuu: (isLast && ex.hasuu) ? ex.hasuu : '',
        hakai: (isLast && ex.hakai) ? ex.hakai : ''
      });
    });
  });
  return rows;
}
function doSend(){
  const btn = document.getElementById('sendBtn');
  const err = document.getElementById('err2');
  err.textContent = '';
  if (!navigator.onLine){ err.textContent = 'オフラインです。ネットに繋いでから送信してください。（データは保持されています）'; return; }
  if (pending.maker !== auth.maker){
    err.textContent = 'このデータはメーカー「' + pending.maker + '」のものです。一度そのメーカーでログインし直してください。';
    return;
  }
  btn.disabled = true; btn.textContent = '送信中...';
  const payload = { maker: pending.maker, pw: auth.pw, shukkaDate: pending.shukkaDate, rows: buildRows() };
  const itemsSnapshot = reviewItems();   // pendingを消す前に品番別内訳を保存しておく（履歴用）
  fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload) })
    .then(r => r.json()).then(res => {
      btn.disabled = false; btn.textContent = '送信（ネット必要）';
      if (!res.ok){ err.textContent = 'エラー: ' + (res.message || '不明'); return; }
      const hist = lget(K_HIST, []);
      hist.unshift({ sentAt: new Date().toISOString(), maker: payload.maker, shukkaDate: pending.shukkaDate, rows: res.added, items: itemsSnapshot });
      lset(K_HIST, hist.slice(0, 200));  // 一覧はタップ式で軽いので、少し多めに保持
      ldel(K_PENDING); pending = null; qrSeen = new Set();
      document.getElementById('doneTitle').textContent = '送信完了';
      document.getElementById('doneBody').innerHTML =
        payload.maker + '<br>納入日 ' + payload.shukkaDate + '<br>追記 ' + res.added + ' 行<br><br>納品書アプリ側で「QRデータ取込」してください。';
      stopCamera();
      show('s-done');
    })
    .catch(e => {
      btn.disabled = false; btn.textContent = '送信（ネット必要）';
      err.textContent = '送信できませんでした（通信エラー）。データは保持されています。もう一度お試しください。\n' + e.message;
    });
}

/* ================= 読取履歴（送信済み） ================= */
// 一覧（納入日／送信日時）→ タップで詳細（品番別の箱数・数量）に切り替える2階層構成。
let pausedBeforeHistory = false;
let historyData = [];
function openHistory(){
  pausedBeforeHistory = paused;
  paused = true;
  renderHistoryList();
  show('s-history');
}
function renderHistoryList(){
  historyData = lget(K_HIST, []).filter(h => !auth || h.maker === auth.maker);
  document.getElementById('histInfo').textContent = (auth ? auth.maker : '') + '　送信済み ' + historyData.length + '件（新しい順）';
  const box = document.getElementById('histList');
  if (!historyData.length){
    box.innerHTML = '<div class="note">送信履歴がありません</div>';
  } else {
    box.innerHTML = historyData.map(function (h, i) {
      const dtStr = new Date(h.sentAt).toLocaleString('ja-JP');
      return '<div class="hist-row" data-i="' + i + '">'
        + '<div class="hist-row-main">📅 納入日 ' + esc(h.shukkaDate) + '</div>'
        + '<div class="hist-row-sub">送信 ' + dtStr + '　' + (h.rows||0) + '行</div>'
        + '</div>';
    }).join('');
    box.querySelectorAll('.hist-row').forEach(function (el) {
      el.addEventListener('click', function () { showHistoryDetail(parseInt(el.dataset.i, 10)); });
    });
  }
  const btn = document.getElementById('histBackBtn');
  btn.textContent = '← もどる';
  btn.onclick = closeHistory;
}
function showHistoryDetail(i){
  const h = historyData[i];
  if (!h) return;
  const dtStr = new Date(h.sentAt).toLocaleString('ja-JP');
  document.getElementById('histInfo').textContent = '納入日 ' + h.shukkaDate + '　送信 ' + dtStr;
  const rows = (h.items || []).map(function (it) {
    return '<tr><td>' + esc(it.hinban) + '</td><td class="num">' + it.hako + '</td>'
      + '<td class="num">' + (it.hasuu !== '' && it.hasuu != null ? it.hasuu : '—') + '</td>'
      + '<td class="num">' + (it.hakai !== '' && it.hakai != null ? it.hakai : '—') + '</td>'
      + '<td class="num">' + it.suryou + '</td></tr>';
  }).join('');
  document.getElementById('histList').innerHTML =
    '<table><thead><tr><th>品番</th><th style="text-align:right">箱数</th><th style="text-align:right">端数</th><th style="text-align:right">破壊</th><th style="text-align:right">数量</th></tr></thead><tbody>' + rows + '</tbody></table>';
  const btn = document.getElementById('histBackBtn');
  btn.textContent = '← 一覧にもどる';
  btn.onclick = renderHistoryList;
}
function closeHistory(){
  paused = pausedBeforeHistory;
  document.getElementById('btnPause').textContent = paused ? '▶ 再開' : '⏸ 一時停止';
  updateScanHeader();
  show('s-scan');
}

/* ================= 一時停止 / ライト ================= */
function togglePause(){
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? '▶ 再開' : '⏸ 一時停止';
}
async function toggleTorch(){
  if (!track) return;
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced:[{ torch: torchOn }] });
    document.getElementById('btnTorch').textContent = torchOn ? '🔦 ライト ON' : '🔦 ライト';
  } catch(e){ torchOn = !torchOn; }
}

/* ================= 音 ================= */
let actx = null;
function beep(freq, dur){
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = 'square'; o.frequency.value = freq;
    // 音量は1.0（Web Audioの上限）まで上げ、その音量を長めに持続させてから減衰させることで
    // 体感の大きさ・長さを両方稼ぐ（durが呼び出し元で伸びているのと合わせて効く）
    g.gain.setValueAtTime(1, actx.currentTime);
    g.gain.setValueAtTime(1, actx.currentTime + dur * .7);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}
function flash(cls, txt){
  const f = document.getElementById('flash');
  f.className = 'flash ' + cls; f.textContent = txt;
  f.style.opacity = '.9';
  setTimeout(()=>{ f.style.opacity = '0'; }, 130);
}

/* ================= misc ================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
window.addEventListener('beforeunload', (e) => {
  const p = lget(K_PENDING, null);
  if (p && p.scans && p.scans.length){ e.preventDefault(); e.returnValue = ''; }
});

/* ================= 下スワイプでの引っ張り更新（pull-to-refresh）を無効化 ================= */
/* 納品書アプリと同じ対策：一番上でさらに下にドラッグする動きだけを打ち消す。通常のスクロールは阻害しない。 */
(function () {
  let startY = 0;
  document.addEventListener('touchstart', function (e) {
    startY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
    if (scrollTop === 0 && e.touches[0].clientY > startY) {
      e.preventDefault();
    }
  }, { passive: false });
})();

/* ================= 戻る操作（スワイプ/戻るボタン）でページを離脱させない ================= */
/* 納品書アプリと同じ pushState/popstate の対策：常にダミーの履歴を積み直し、実際の離脱は起こさせない。
   未送信データが残っている時は確認の上でログイン画面に戻す。 */
function pushDummyHistory(){ try { history.pushState({ ukeireScan: true }, ''); } catch (e) {} }
window.addEventListener('popstate', function () {
  pushDummyHistory();
  const hasUnsent = pending && pending.scans && pending.scans.length;
  const onLogin = document.getElementById('s-login').classList.contains('on');
  if (onLogin) return;   // ログイン画面まで戻ってきているなら、そこは普通の画面として扱う
  if (hasUnsent) {
    showConfirm('未送信のデータ（' + pending.scans.length + '枚）があります。\nログイン画面に戻りますか？\n（データは保持されます）', logout);
  }
});
pushDummyHistory();
